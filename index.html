<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Translation Helper</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    .controls {
      background-color: #161b22;
      border: 1px solid #30363d;
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input, select {
      padding: 8px 10px;
      background-color: #010409;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background-color: #161b22;
    }
    th, td {
      border: 1px solid #30363d;
      padding: 10px 12px;
      text-align: left;
    }
    th { background-color: #21262d; }
    button {
      background-color: #238636;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 24px;
    }
    button:hover { background-color: #2ea043; }
  </style>
</head>
<body>

  <h2>Translation Helper</h2>

  <div class="controls">
    <label><strong>GitHub Personal Access Token (repo scope):</strong></label>
    <input type="password" id="patToken" placeholder="ghp_xxxxxxxxxxxx">
    
    <label><strong>Target Language & Region:</strong></label>
    <input type="text" id="langName" placeholder="e.g. Portuguese (Brazil)">
  </div>

  <table>
    <thead>
      <tr>
        <th>Original English Text</th>
        <th>Your Translation</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <button onclick="saveTranslation()">Save to Repository</button>

  <script>
    const repo = "armaninyow/Remove-Context-Menu-Items";
    const folderPath = "locales";

    const sections = {
      "Bloatware Items": [
        "Move to OneDrive", "Ask Copilot", "Scan with Microsoft Defender...",
        "Create with Designer", "Edit with Clipchamp", "Ask Microsoft 365 Copilot"
      ]
    };

    const tbody = document.getElementById("tableBody");
    for (const [section, items] of Object.entries(sections)) {
      const headerRow = document.createElement("tr");
      headerRow.innerHTML = `<td colspan="2" style="background-color: #21262d; font-weight: bold;">${section}</td>`;
      tbody.appendChild(headerRow);

      items.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><code>${item}</code></td>
          <td><input type="text" data-original="${item}" placeholder="Translation..."></td>
        `;
        tbody.appendChild(row);
      });
    }

    async function saveTranslation() {
      const token = document.getElementById("patToken").value.trim();
      const langName = document.getElementById("langName").value.trim();

      if (!token || !langName) {
        alert("Please enter your GitHub Token and Target Language.");
        return;
      }

      let mdOutput = "";
      document.querySelectorAll("#tableBody input").forEach(input => {
        const orig = input.getAttribute("data-original");
        const val = input.value.trim();
        mdOutput += `* \`${orig}\`: ${val}\n\n`;
      });

      const filePath = `${folderPath}/${langName}.md`;
      const url = `https://api.github.com/repos/${repo}/contents/${filePath}`;

      // Check if file exists to get SHA
      let sha = null;
      const checkRes = await fetch(url, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (checkRes.ok) {
        const data = await checkRes.json();
        sha = data.sha;
      }

      // Push change
      const body = {
        message: `Update ${langName} translation`,
        content: btoa(unescape(encodeURIComponent(mdOutput)))
      };
      if (sha) body.sha = sha;

      const res = await fetch(url, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      if (res.ok) {
        alert("Saved successfully!");
      } else {
        const err = await res.json();
        alert("Error: " + err.message);
      }
    }
  </script>
</body>
</html>
