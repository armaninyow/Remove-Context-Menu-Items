<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Translation Helper</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --surface-color: #161b22;
      --border-color: #30363d;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --accent-green: #238636;
      --accent-green-hover: #2ea043;
      --section-bg: #21262d;
      --input-bg: #010409;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }

    h2 {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .controls {
      background-color: var(--surface-color);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .hint {
      font-size: 13px;
      color: var(--text-secondary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background-color: var(--surface-color);
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      text-align: left;
    }

    th {
      background-color: var(--section-bg);
      color: var(--text-primary);
      font-weight: 600;
    }

    code {
      background-color: rgba(110, 118, 129, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      font-size: 13px;
    }

    input[type="text"], select {
      box-sizing: border-box;
      padding: 8px 10px;
      background-color: var(--input-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
    }

    input[type="text"] {
      width: 100%;
    }

    select {
      width: 280px;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #58a6ff;
    }

    button {
      background-color: var(--accent-green);
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 24px;
      transition: background-color 0.15s ease;
    }

    button:hover {
      background-color: var(--accent-green-hover);
    }
  </style>
</head>
<body>

  <h2>Translate Context Menu Items</h2>

  <div class="controls">
    <div class="controls-row">
      <label for="langName"><strong>Target Language & Region:</strong></label>
      <input type="text" id="langName" placeholder="e.g. Portuguese (Brazil)" style="width: 280px;">
    </div>
    <div class="controls-row">
      <label for="fileSelect"><strong>Or Load Existing:</strong></label>
      <select id="fileSelect" onchange="handleFileSelection()">
        <option value="">-- Create New Language --</option>
      </select>
    </div>
    <span class="hint">Format: <code>Language (Region).md</code> inside <code>root/locales/</code>.</span>
    <span class="hint"><strong>Note:</strong> To find your exact language string, check <code>Settings > Time &amp; Language > Language &amp; Region</code> in Windows.</span>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 45%;">Original English Text</th>
        <th style="width: 55%;">Your Translation</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <button onclick="submitTranslation()">Create Pull Request on GitHub</button>

  <script>
    const repo = "armaninyow/Remove-Context-Menu-Items";
    const folderPath = "locales";

    const sections = {
      "Bloatware Items": [
        "Move to OneDrive", "Ask Copilot", "Scan with Microsoft Defender...",
        "Create with Designer", "Edit with Clipchamp", "Ask Microsoft 365 Copilot"
      ],
      "Basic Items": [
        "Open", "Open with", "Cut", "Copy", "Create shortcut", "Delete", "Rename",
        "Send to", "Open in new tab", "Open in new window", "Edit", "Play",
        "Preview", "Print", "Share", "Refresh", "Copy as path",
        "Customize this folder...", "Add to Favorites", "Pin to Start",
        "Cast to Device", "Give access to", "Restore previous versions",
        "Include in library", "Rotate right", "Rotate left", "Display settings",
        "Personalize", "Set as desktop background", "View", "Sort by", "Group by",
        "New", "Properties", "Paste", "Pin to Quick access", "Extract All..."
      ],
      "App-Specific Items": [
        "Send with Quick Share", "Add to VLC media player's Playlist",
        "Play with VLC media player", "Add to Media Player play queue",
        "Play with Media Player", "Edit in Notepad", "Edit with Notepad++",
        "Edit with Photos", "Edit with Paint", "NVIDIA Control Panel",
        "Open in Terminal", "Always keep on this device", "Free up space", "WinRAR"
      ]
    };

    const tbody = document.getElementById("tableBody");
    for (const [section, items] of Object.entries(sections)) {
      const headerRow = document.createElement("tr");
      headerRow.innerHTML = `<td colspan="2" style="background-color: var(--section-bg); font-weight: bold;">${section}</td>`;
      tbody.appendChild(headerRow);

      items.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><code>${item}</code></td>
          <td><input type="text" data-section="${section}" data-original="${item}" placeholder="Type translation..."></td>
        `;
        tbody.appendChild(row);
      });
    }

    async function loadExistingFiles() {
      const select = document.getElementById("fileSelect");
      try {
        const response = await fetch(`https://api.github.com/repos/${repo}/contents/${folderPath}`);
        if (!response.ok) return;
        const files = await response.json();
        
        files.forEach(file => {
          if (file.name.endsWith(".md")) {
            const langName = file.name.replace(".md", "");
            const option = document.createElement("option");
            option.value = file.download_url;
            option.textContent = `Edit existing: ${langName}`;
            select.appendChild(option);
          }
        });
      } catch (e) {
        console.error("Could not load existing translation files.", e);
      }
    }

    async function handleFileSelection() {
      const select = document.getElementById("fileSelect");
      const langInput = document.getElementById("langName");
      
      if (!select.value) {
        langInput.value = "";
        document.querySelectorAll("#tableBody input").forEach(i => i.value = "");
        return;
      }

      const fileUrl = select.value;
      const fileName = select.options[select.selectedIndex].text.replace("Edit existing: ", "");
      langInput.value = fileName;

      try {
        const res = await fetch(fileUrl);
        const text = await res.text();
        
        const lines = text.split("\n");
        lines.forEach(line => {
          const match = line.match(/^\* `(.+?)`:\s*(.*)$/);
          if (match) {
            const input = document.querySelector(`input[data-original="${CSS.escape(match[1])}"]`);
            if (input) {
              input.value = match[2];
            }
          }
        });
      } catch (e) {
        alert("Failed to load file contents.");
      }
    }

    loadExistingFiles();

    function submitTranslation() {
      const langInput = document.getElementById("langName").value.trim();
      if (!langInput) {
        alert("Please enter or select a Target Language & Region.");
        document.getElementById("langName").focus();
        return;
      }

      const inputs = document.querySelectorAll("#tableBody input");
      let mdOutput = "";
      let currentSection = "";

      inputs.forEach(input => {
        const sec = input.getAttribute("data-section");
        const orig = input.getAttribute("data-original");
        const val = input.value.trim();

        if (sec !== currentSection) {
          mdOutput += (currentSection ? "\n" : "") + `### ${sec}\n\n`;
          currentSection = sec;
        }
        mdOutput += `<!-- ${orig} -->\n* \`${orig}\`: ${val}\n\n`;
      });

      const fileName = encodeURIComponent(`${langInput}.md`);
      const content = encodeURIComponent(mdOutput.trim() + "\n");
      const message = encodeURIComponent(`Update ${langInput} translation`);

      window.open(`https://github.com/${repo}/new/main?filename=${folderPath}/${fileName}&value=${content}&message=${message}`, "_blank");
    }
  </script>
</body>
</html>
